name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality gates
    runs-on: ["self-hosted", "Linux", "X64", "ram-ge-16g", "disk-ge-100g"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ignition-is-go/pulse-actions/actions/setup-rust@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
          linux-dependencies: build
          cache-shared-key: ci
          compiler-cache-endpoint: ${{ secrets.CI_CACHE_ENDPOINT }}
          compiler-cache-bucket: ${{ secrets.CI_CACHE_BUCKET }}
          compiler-cache-access-key: ${{ secrets.CI_CACHE_ACCESS_KEY }}
          compiler-cache-secret-key: ${{ secrets.CI_CACHE_SECRET_KEY }}
          cache-save-if: ${{ env.CI_NATIVE_CACHE_CONFIGURED != 'true' }}
      - name: Set up Cargo Flux and ROSE cache
        uses: ignition-is-go/cargo-flux@ae2ffa5f4420add3ab3c98665a4b5c0374bf2a5b
        with:
          version: 0.12.0
          cache: ${{ env.CI_NATIVE_CACHE_CONFIGURED == 'true' && 's3' || '' }}
          cache-endpoint: ${{ vars.CI_CACHE_S3_ENDPOINT || secrets.CI_CACHE_ENDPOINT }}
          cache-bucket: ${{ vars.CI_CACHE_S3_BUCKET || secrets.CI_CACHE_BUCKET }}
          cache-access-key-id: ${{ secrets.CI_CACHE_S3_ACCESS_KEY_ID || secrets.CI_CACHE_ACCESS_KEY }}
          cache-secret-access-key: ${{ secrets.CI_CACHE_S3_SECRET_ACCESS_KEY || secrets.CI_CACHE_SECRET_KEY }}
      - name: Restore ROSE compiler snapshot
        id: compiler-snapshot
        if: env.CI_NATIVE_CACHE_CONFIGURED == 'true'
        uses: ignition-is-go/pulse-actions/actions/flux-target-cache@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          operation: restore
          scope: quality
          plugin: cargo
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust
        run: cargo flux run check
      - name: Run strict Clippy
        run: cargo flux run lint
      - name: Run tests
        run: cargo flux run test
      - name: Check WebAssembly target
        run: cargo flux run check-wasm
      - name: Install browser test tools
        run: |
          curl --fail --location --retry 3 https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/trunk.tar.gz"
          echo "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  $RUNNER_TEMP/trunk.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$CARGO_HOME/bin" trunk
          trunk --version
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv .browser-venv
          .browser-venv/bin/pip install -r tests/browser/requirements.txt
          .browser-venv/bin/python -m playwright install --with-deps chromium
      - name: Build browser fixture
        working-directory: examples/demo
        run: trunk build --locked
      - name: Test node menu across pane boundaries
        shell: bash
        run: |
          python3 -m http.server 8181 --bind 127.0.0.1 --directory examples/demo/dist > /tmp/node-menu-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in {1..50}; do
            if curl --fail --silent http://127.0.0.1:8181/ >/dev/null; then break; fi
            sleep 0.1
          done
          .browser-venv/bin/python tests/browser/test_node_menu.py
      - name: Verify crate is publishable
        run: cargo publish --dry-run --locked --allow-dirty -p leptos-node-graph
      - name: Save ROSE snapshot and clean local Cargo targets
        if: success() && steps.compiler-snapshot.outputs.state != ''
        uses: ignition-is-go/pulse-actions/actions/flux-target-cache@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          operation: save
          state: ${{ steps.compiler-snapshot.outputs.state }}
      - uses: ignition-is-go/pulse-actions/actions/report-resources@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
        if: always()
    env:
      CI_NATIVE_CACHE_CONFIGURED: ${{ (secrets.CI_CACHE_S3_ACCESS_KEY_ID || secrets.CI_CACHE_ACCESS_KEY) != '' }}
