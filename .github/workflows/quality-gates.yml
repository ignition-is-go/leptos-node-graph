name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality gates
    runs-on: ["self-hosted", "Linux", "X64", "ram-ge-16g", "disk-ge-100g"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ignition-is-go/pulse-actions/actions/setup-rust@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
          linux-dependencies: build
          cache-shared-key: ci
          compiler-cache-endpoint: ${{ secrets.CI_CACHE_ENDPOINT }}
          compiler-cache-bucket: ${{ secrets.CI_CACHE_BUCKET }}
          compiler-cache-access-key: ${{ secrets.CI_CACHE_ACCESS_KEY }}
          compiler-cache-secret-key: ${{ secrets.CI_CACHE_SECRET_KEY }}
      - name: Check for cargo-binstall
        id: cargo-binstall
        shell: bash
        run: |
          if command -v cargo-binstall >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install cargo-binstall
        if: steps.cargo-binstall.outputs.available != 'true'
        uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
        with:
          version: "1.21.1"
      - name: Install or update cargo-flux
        run: cargo binstall cargo-flux --no-confirm --force
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust
        run: cargo flux run check
      - name: Run strict Clippy
        run: cargo flux run lint
      - name: Run tests
        run: cargo flux run test
      - name: Check WebAssembly target
        run: cargo flux run check-wasm
      - name: Install browser test tools
        run: |
          cargo binstall trunk --version 0.21.14 --no-confirm
          python3 -m venv .browser-venv
          .browser-venv/bin/pip install -r tests/browser/requirements.txt
          .browser-venv/bin/python -m playwright install --with-deps chromium
      - name: Build browser fixture
        working-directory: examples/demo
        run: trunk build --locked
      - name: Test node menu across pane boundaries
        shell: bash
        run: |
          python3 -m http.server 8181 --bind 127.0.0.1 --directory examples/demo/dist > /tmp/node-menu-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:8181/ >/dev/null; then break; fi
            sleep 0.1
          done
          .browser-venv/bin/python tests/browser/test_node_menu.py
      - name: Verify crate is publishable
        run: cargo publish --dry-run --locked --allow-dirty -p leptos-node-graph
      - uses: ignition-is-go/pulse-actions/actions/report-resources@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
        if: always()
