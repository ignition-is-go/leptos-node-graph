[package]
name = "leptos-node-graph"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
web-sys = { version = "0.3", features = [
    "HtmlElement",
    "DomRect",
    "MouseEvent",
    "KeyboardEvent",
    "WheelEvent",
    "PointerEvent",
    "ResizeObserver",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    "SvgsvgElement",
    "SvgPathElement",
    "Element",
    "CssStyleDeclaration",
] }
wasm-bindgen = "0.2"
