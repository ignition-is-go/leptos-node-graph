[package]
name = "leptos-node-graph"
version = "0.1.0"
edition = "2024"
description = "A reactive node graph editor component for Leptos"
documentation = "https://docs.rs/leptos-node-graph"
homepage = "https://github.com/ignition-is-go/leptos-node-graph"
repository = "https://github.com/ignition-is-go/leptos-node-graph"

[package.metadata.flux]
tasks = ["check", "check-wasm", "build", "test", "lint", "publish"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
web-sys = { version = "0.3", features = [
    "HtmlElement",
    "DomRect",
    "MouseEvent",
    "KeyboardEvent",
    "WheelEvent",
    "PointerEvent",
    "SvgsvgElement",
    "SvgPathElement",
    "Element",
    "CssStyleDeclaration",
    # `Window::get_computed_style` — wheel routing checks a scroll box's overflow.
    "Window",
] }
leptos-use = "0.18"
md-icons = "0.3.3"
